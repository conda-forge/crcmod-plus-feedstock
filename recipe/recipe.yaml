context:
  version: "2.3.6"

package:
  name: crcmod-plus
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/c/crcmod-plus/crcmod_plus-${{ version }}.tar.gz
    sha256: d18de4d8f00a1db9747a104daa13b1164ef82e5bd684dedd9d03ecbca52c5af0

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools >=61
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - crcmod
        - crcmod._crcfunext
      pip_check: true

about:
  summary: CRC generator - modernized
  homepage: https://github.com/ntamas/crcmod-plus
  license: MIT
  license_file:
    - LICENSE.txt
  repository: https://github.com/ntamas/crcmod-plus
  documentation: https://github.com/ntamas/crcmod-plus#readme

extra:
  recipe-maintainers:
    - carlodri
